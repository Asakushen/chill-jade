<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Chill Jade 的收藏炼化流程</title><desc id="desc">一个网址经由页面元数据、人工整理和可选可信自动化后，成为可检索的个人书签。</desc>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#94a3b8"/></marker><filter id="gl"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1600" height="900" fill="#020617"/><rect width="1600" height="900" fill="url(#g)" opacity=".6"/>
<text x="105" y="105" fill="#f8fafc" font-size="45" font-family="system-ui,sans-serif" font-weight="700">收藏不是堆放，是一次轻量整理</text><text x="108" y="150" fill="#94a3b8" font-size="22" font-family="system-ui,sans-serif">Chill Jade · 从一条链接到日后还能找回的记录</text>
<g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M400 450H510"/><path d="M760 450H870"/><path d="M1120 450H1230"/></g>
<g font-family="system-ui,sans-serif"><rect x="105" y="330" width="295" height="240" rx="22" fill="#0c2534" stroke="#22d3ee" stroke-width="3"/><text x="145" y="405" fill="#67e8f9" font-size="30" font-weight="700">一条链接</text><text x="145" y="448" fill="#cbd5e1" font-size="20">URL + 当下的念头</text><text x="145" y="492" fill="#94a3b8" font-size="18">“这个以后会用到”</text>
<rect x="510" y="330" width="250" height="240" rx="22" fill="#2b224b" stroke="#a78bfa" stroke-width="3"/><text x="550" y="405" fill="#c4b5fd" font-size="30" font-weight="700">补全来处</text><text x="550" y="448" fill="#ddd6fe" font-size="20">标题 · 描述</text><text x="550" y="492" fill="#a78bfa" font-size="18">可由人或可信工具完成</text>
<rect x="870" y="330" width="250" height="240" rx="22" fill="#3a260d" stroke="#fbbf24" stroke-width="3"/><text x="910" y="405" fill="#fde68a" font-size="30" font-weight="700">放对位置</text><text x="910" y="448" fill="#fef3c7" font-size="20">分类 · 标签 · 可见性</text><text x="910" y="492" fill="#fcd34d" font-size="18">先查重，再写入</text>
<rect x="1230" y="330" width="265" height="240" rx="22" fill="#083b2c" stroke="#22c55e" stroke-width="3" filter="url(#gl)"/><text x="1270" y="405" fill="#86efac" font-size="30" font-weight="700">留在玉简</text><text x="1270" y="448" fill="#d1fae5" font-size="20">搜索 · 过滤 · 导出</text><text x="1270" y="492" fill="#6ee7b7" font-size="18">下次需要时能回来</text></g>
<text x="105" y="700" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="24">自动化只负责省掉重复动作；分类、说明和公开范围，始终可以由主人决定。</text>
</svg>
