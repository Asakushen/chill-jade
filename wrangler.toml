name = "asakusa-gyokukan"
main = "src/worker/index.ts"
compatibility_date = "2026-07-15"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Before deploying, create your own D1 database and replace the placeholder below:
#   npx wrangler d1 create asakusa-gyokukan
# Never point a public clone at an existing production database.
[[d1_databases]]
binding = "DB"
database_name = "asakusa-gyokukan"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"
migrations_table = "agy_d1_migrations"
